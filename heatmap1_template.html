<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FAVV registered beekeepers heatmap</title>
    <meta name="author" content="Peter Vanhevel"/>
    <meta name="robots" content="index, follow"/>
    
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background-color: #f4f7f6; color: #333333;
            line-height: 1.6;
            display: flex; flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            background-color: #2c3e50; padding: 1rem 0; text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex-shrink: 0; position: sticky; top: 0; z-index: 1000;
        }
        .navbar a {
            color: #ecf0f1; text-decoration: none; margin: 0 15px;
            font-weight: 600; font-size: 0.95rem; transition: color 0.3s ease;
        }
        .navbar a:hover { color: #3498db; text-decoration: underline; }
        .navbar .active { color: #3498db; border-bottom: 2px solid #3498db; padding-bottom: 4px; }

        .container {
            flex-grow: 1; width: 100%; max-width: 1400px;
            margin: 0 auto; padding: 20px;
            background: #ffffff; box-sizing: border-box;
            display: flex; flex-direction: column; min-height: 0;
        }
        h1 {
            color: #2c3e50; margin-top: 0; margin-bottom: 15px;
            border-bottom: 2px solid #3498db; padding-bottom: 10px; flex-shrink: 0;
        }

        /* BULLETPROOF Plotly overrides */
        .container > div { 
            flex: 1 1 0% !important;
            display: flex; 
            flex-direction: column; 
            min-height: 0; 
        }
        .plotly-graph-div { 
            flex: 1 1 0% !important;
            width: 100% !important; 
            height: 100% !important; 
            min-height: 600px !important; /* Forces visibility even if flexbox struggles */
        }

        .footer { text-align: center; padding: 15px; color: #7f8c8d; font-size: 0.85rem; flex-shrink: 0; background-color: #f4f7f6; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html">Hive weight</a> | 
        <a href="asian_hornet_observations.html">AH obs. near Hofstade</a> | 
        <a href="analysis_vespawatch.html">AH obs. tables</a> | 
        <a href="heatmap_vespawatch.html">AH obs. heatmap</a> |
        <a href="heatmap_beekeepers.html" class="active">Beeks heatmap</a> |
        <a href="winter_weight_loss.html">Winter weight loss</a>
    </nav>

    <div class="container">
        <h1>FAVV registered beekeepers heatmap</h1>
        {content}
    </div>

    <div class="footer">
        Bron: FAVV inter_actieve_actoren_NL.csv &copy; 2026
    </div>
</body>
</html>
